<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Health</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1e293b;padding:16px}
h1{font-size:1.1rem;font-weight:600;margin-bottom:12px;color:#475569}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:#f8fafc;border-radius:10px;padding:12px;border:1px solid #e2e8f0}
.l{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:2px}
.v{font-size:1.5rem;font-weight:700}
.m .v{color:#059669}
.p .v{color:#2563eb}
.u .v{color:#d97706}
.t .v{color:#7c3aed;font-size:.8rem}
</style>
</head>
<body>
<h1>Server Health</h1>
<div class="g">
<div class="c m"><div class="l">Memory</div><div class="v" id="a">—</div></div>
<div class="c p"><div class="l">Processes</div><div class="v" id="b">—</div></div>
<div class="c u"><div class="l">Uptime</div><div class="v" id="c">—</div></div>
<div class="c t"><div class="l">Updated</div><div class="v" id="d">—</div></div>
</div>
<script>
function r(d){
document.getElementById("a").textContent=(d.memory_mb||"—")+" MB";
document.getElementById("b").textContent=d.processes||"—";
var s=d.uptime_sec;
document.getElementById("c").textContent=s?(s>3600?Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m":s>60?Math.floor(s/60)+"m "+s%60+"s":s+"s"):"—";
document.getElementById("d").textContent=d.timestamp?new Date(d.timestamp).toLocaleTimeString():new Date().toLocaleTimeString();
}
window.addEventListener("message",function(e){
try{
var m=e.data;
if(!m)return;
if(m.params&&m.params.content){
var t=m.params.content.find(function(c){return c.type==="text"});
if(t&&t.text)r(JSON.parse(t.text));
}
}catch(x){}
});
r({memory_mb:50,processes:441,uptime_sec:120,timestamp:new Date().toISOString()});
</script>
</body>
</html>
