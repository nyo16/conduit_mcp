<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Health</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1e293b;padding:16px}
h1{font-size:1.1rem;font-weight:600;margin-bottom:12px;color:#475569}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.c{background:#f8fafc;border-radius:10px;padding:12px;border:1px solid #e2e8f0}
.l{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8;margin-bottom:2px}
.v{font-size:1.5rem;font-weight:700}
.m .v{color:#059669}
.p .v{color:#2563eb}
.u .v{color:#d97706}
.t .v{color:#7c3aed;font-size:.8rem}
button{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:.85rem;cursor:pointer;width:100%}
button:hover{background:#2563eb}
button:disabled{background:#94a3b8;cursor:default}
.s{text-align:center;margin-top:8px;font-size:.7rem;color:#94a3b8}
</style>
</head>
<body>
<h1>Server Health</h1>
<div class="g">
<div class="c m"><div class="l">Memory</div><div class="v" id="mem">—</div></div>
<div class="c p"><div class="l">Processes</div><div class="v" id="proc">—</div></div>
<div class="c u"><div class="l">Uptime</div><div class="v" id="up">—</div></div>
<div class="c t"><div class="l">Updated</div><div class="v" id="ts">—</div></div>
</div>
<button id="btn">Refresh Metrics</button>
<div class="s" id="st">Connecting...</div>
<script>
(function(){
  // --- MCP Apps Protocol (inline, no external deps) ---
  var reqId = 0;
  var pending = {};
  var handlers = {};
  var notifHandlers = {};

  function send(msg) {
    window.parent.postMessage(msg, "*");
  }

  function request(method, params) {
    return new Promise(function(resolve, reject) {
      var id = ++reqId;
      pending[id] = { resolve: resolve, reject: reject };
      send({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }

  function notification(method, params) {
    send({ jsonrpc: "2.0", method: method, params: params || {} });
  }

  function onNotification(method, handler) {
    notifHandlers[method] = handler;
  }

  function onRequest(method, handler) {
    handlers[method] = handler;
  }

  window.addEventListener("message", function(ev) {
    var msg = ev.data;
    if (!msg || msg.jsonrpc !== "2.0") return;

    // Response to our request
    if (msg.id != null && pending[msg.id]) {
      var p = pending[msg.id];
      delete pending[msg.id];
      if (msg.error) p.reject(new Error(msg.error.message || "Error"));
      else p.resolve(msg.result);
      return;
    }

    // Request from host (needs response)
    if (msg.id != null && msg.method) {
      var h = handlers[msg.method];
      var result = h ? h(msg.params) : {};
      send({ jsonrpc: "2.0", id: msg.id, result: result });
      return;
    }

    // Notification from host
    if (msg.method && !msg.id) {
      var nh = notifHandlers[msg.method];
      if (nh) nh(msg.params);
    }
  });

  // Handle ping from host
  onRequest("ping", function() { return {}; });

  // --- UI Rendering ---
  function render(data) {
    document.getElementById("mem").textContent = (data.memory_mb || "—") + " MB";
    document.getElementById("proc").textContent = data.processes || "—";
    var s = data.uptime_sec;
    document.getElementById("up").textContent = s
      ? (s > 3600 ? Math.floor(s/3600)+"h "+Math.floor(s%3600/60)+"m"
        : s > 60 ? Math.floor(s/60)+"m "+s%60+"s" : s+"s")
      : "—";
    document.getElementById("ts").textContent = data.timestamp
      ? new Date(data.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
    document.getElementById("st").textContent = "Live";
  }

  function parseToolContent(params) {
    if (!params) return null;
    var content = params.content;
    if (!content) return null;
    for (var i = 0; i < content.length; i++) {
      if (content[i].type === "text" && content[i].text) {
        try { return JSON.parse(content[i].text); } catch(e) {}
      }
    }
    return null;
  }

  // Receive tool result from host
  onNotification("ui/notifications/tool-result", function(params) {
    var data = parseToolContent(params);
    if (data) render(data);
  });

  // Also handle tool-input (streaming)
  onNotification("ui/notifications/tool-input", function(params) {
    // Tool input contains the arguments, not the result
  });

  // Refresh button — calls get_live_metrics via host
  var btn = document.getElementById("btn");
  btn.addEventListener("click", function() {
    btn.disabled = true;
    document.getElementById("st").textContent = "Refreshing...";
    request("tools/call", { name: "get_live_metrics", arguments: {} })
      .then(function(result) {
        var data = parseToolContent(result);
        if (data) render(data);
        btn.disabled = false;
      })
      .catch(function(err) {
        document.getElementById("st").textContent = "Error: " + err.message;
        btn.disabled = false;
      });
  });

  // --- MCP Apps Handshake ---
  async function connect() {
    try {
      var initResult = await request("ui/initialize", {
        appInfo: { name: "Server Health", version: "1.0.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26"
      });
      notification("ui/notifications/initialized");
      document.getElementById("st").textContent = "Connected — waiting for tool result...";

      // Report size so host can resize iframe
      var w = document.documentElement.scrollWidth;
      var h = document.documentElement.scrollHeight;
      notification("ui/notifications/size-changed", { width: w, height: h });
    } catch(e) {
      document.getElementById("st").textContent = "Fallback mode";
      render({ memory_mb: 50, processes: 441, uptime_sec: 120, timestamp: new Date().toISOString() });
    }
  }

  connect();
})();
</script>
</body>
</html>
